<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Management - Zibele Construction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-link {
            color: white;
            text-decoration: none;
        }

        .back-link:hover {
            color: #f4b400;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .intro {
            margin-bottom: 30px;
            color: #666;
        }

        .form-section,
        .table-section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .form-section h2,
        .table-section h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / 3;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background-color: #f4b400;
            color: #222;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: #d99c00;
        }

        .delete-button {
            background-color: #d9534f;
            color: white;
        }

        .delete-button:hover {
            background-color: #c9302c;
        }

        .edit-button {
            background-color: #5bc0de;
            color: white;
        }

        .edit-button:hover {
            background-color: #31b0d5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #222;
            color: white;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }

        .selected-row {
            background-color: #fff2c2;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: 1;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            header {
                flex-direction: column;
                gap: 10px;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        Zibele Construction
    </div>

    <a class="back-link" href="dashboard.html">
        ← Back to Dashboard
    </a>

</header>


<div class="container">

    <h1>Customer Management</h1>

    <p class="intro">
        Add, view, edit and delete customer information.
    </p>


    <div class="form-section">

        <h2>Customer Information</h2>

        <div class="form-grid">

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    placeholder="Enter customer name"
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter email address"
                >

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number"
                >

            </div>


            <div class="form-group">

                <label for="address">
                    Address
                </label>

                <input
                    type="text"
                    id="address"
                    placeholder="Enter address"
                >

            </div>

        </div>


        <div class="button-group">

            <button onclick="addCustomer()">
                Add Customer
            </button>

            <button
                class="edit-button"
                onclick="editCustomer()"
            >
                Edit Selected
            </button>

            <button
                class="delete-button"
                onclick="deleteCustomer()"
            >
                Delete Selected
            </button>

        </div>


        <div id="message" class="message"></div>

    </div>


    <div class="table-section">

        <h2>Customers</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Address</th>
                </tr>

            </thead>

            <tbody id="customerTableBody">

            </tbody>

        </table>

    </div>

</div>


<footer>

    <p>
        &copy; 2026 Zibele Construction. Management System.
    </p>

</footer>


<script>

    const API_URL = "http://localhost:3000";

    let selectedCustomerId = null;


    async function loadCustomers() {

        try {

            const response =
                await fetch(`${API_URL}/api/customers`);

            const customers =
                await response.json();

            const tableBody =
                document.getElementById("customerTableBody");

            tableBody.innerHTML = "";

            customers.forEach(customer => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${customer.customer_id}</td>
                    <td>${customer.full_name}</td>
                    <td>${customer.email}</td>
                    <td>${customer.phone || ""}</td>
                    <td>${customer.address || ""}</td>
                `;

                row.onclick = function() {

                    document
                        .querySelectorAll("tbody tr")
                        .forEach(r =>
                            r.classList.remove("selected-row")
                        );

                    row.classList.add("selected-row");

                    selectedCustomerId =
                        customer.customer_id;

                    document.getElementById("fullName").value =
                        customer.full_name;

                    document.getElementById("email").value =
                        customer.email;

                    document.getElementById("phone").value =
                        customer.phone || "";

                    document.getElementById("address").value =
                        customer.address || "";

                };

                tableBody.appendChild(row);

            });

        } catch (error) {

            console.error(
                "Error loading customers:",
                error
            );

        }

    }


    async function addCustomer() {

        const full_name =
            document.getElementById("fullName").value;

        const email =
            document.getElementById("email").value;

        const phone =
            document.getElementById("phone").value;

        const address =
            document.getElementById("address").value;


        if (!full_name || !email) {

            document.getElementById("message").textContent =
                "Please enter the customer's name and email.";

            return;

        }


        try {

            const response =
                await fetch(`${API_URL}/api/customers`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        full_name,
                        email,
                        phone,
                        address
                    })

                });


            if (response.ok) {

                document.getElementById("message").textContent =
                    "Customer added successfully.";

                clearForm();

                loadCustomers();

            } else {

                document.getElementById("message").textContent =
                    "Failed to add customer.";

            }

        } catch (error) {

            console.error(error);

        }

    }


    async function editCustomer() {

        if (!selectedCustomerId) {

            document.getElementById("message").textContent =
                "Please select a customer first.";

            return;

        }


        const full_name =
            document.getElementById("fullName").value;

        const email =
            document.getElementById("email").value;

        const phone =
            document.getElementById("phone").value;

        const address =
            document.getElementById("address").value;


        try {

            const response =
                await fetch(
                    `${API_URL}/api/customers/${selectedCustomerId}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            full_name,
                            email,
                            phone,
                            address
                        })
                    }
                );


            if (response.ok) {

                document.getElementById("message").textContent =
                    "Customer updated successfully.";

                clearForm();

                selectedCustomerId = null;

                loadCustomers();

            }

        } catch (error) {

            console.error(error);

        }

    }


    async function deleteCustomer() {

        if (!selectedCustomerId) {

            document.getElementById("message").textContent =
                "Please select a customer first.";

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/customers/${selectedCustomerId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (response.ok) {

                document.getElementById("message").textContent =
                    "Customer deleted successfully.";

                clearForm();

                selectedCustomerId = null;

                loadCustomers();

            }

        } catch (error) {

            console.error(error);

        }

    }


    function clearForm() {

        document.getElementById("fullName").value = "";
        document.getElementById("email").value = "";
        document.getElementById("phone").value = "";
        document.getElementById("address").value = "";

    }


    loadCustomers();

</script>

</body>
</html>
