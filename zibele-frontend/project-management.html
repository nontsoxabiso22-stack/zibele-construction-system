<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Management - Zibele Construction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #222;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .back-link {
            color: white;
            text-decoration: none;
        }

        .back-link:hover {
            color: #f4b400;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .intro {
            margin-bottom: 30px;
            color: #666;
        }

        .form-section,
        .table-section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .form-section h2,
        .table-section h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / 3;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea,
        select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .button-group {
            margin-top: 20px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            background-color: #f4b400;
            color: #222;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }

        button:hover {
            background-color: #d99c00;
        }

        .delete-button {
            background-color: #d9534f;
            color: white;
        }

        .delete-button:hover {
            background-color: #c9302c;
        }

        .edit-button {
            background-color: #5bc0de;
            color: white;
        }

        .edit-button:hover {
            background-color: #31b0d5;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #222;
            color: white;
        }

        tbody tr {
            cursor: pointer;
        }

        tbody tr:hover {
            background-color: #f5f5f5;
        }

        .selected-row {
            background-color: #fff2c2;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
        }

        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 768px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: 1;
            }

            table {
                display: block;
                overflow-x: auto;
            }

            header {
                flex-direction: column;
                gap: 10px;
            }
        }

    </style>
</head>

<body>

<header>

    <div class="logo">
        Zibele Construction
    </div>

    <a class="back-link" href="dashboard.html">
        ← Back to Dashboard
    </a>

</header>


<div class="container">

    <h1>Project Management</h1>

    <p class="intro">
        Add, view, edit and delete construction projects.
    </p>


    <div class="form-section">

        <h2>Project Information</h2>

        <div class="form-grid">

            <div class="form-group">

                <label for="projectName">
                    Project Name
                </label>

                <input
                    type="text"
                    id="projectName"
                    placeholder="Enter project name"
                >

            </div>


            <div class="form-group">

                <label for="location">
                    Location
                </label>

                <input
                    type="text"
                    id="location"
                    placeholder="Enter project location"
                >

            </div>


            <div class="form-group full">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Enter project description"
                ></textarea>

            </div>


            <div class="form-group">

                <label for="startDate">
                    Start Date
                </label>

                <input
                    type="date"
                    id="startDate"
                >

            </div>


            <div class="form-group">

                <label for="endDate">
                    End Date
                </label>

                <input
                    type="date"
                    id="endDate"
                >

            </div>


            <div class="form-group">

                <label for="status">
                    Status
                </label>

                <select id="status">

                    <option value="Planned">
                        Planned
                    </option>

                    <option value="In Progress">
                        In Progress
                    </option>

                    <option value="Completed">
                        Completed
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="imageUrl">
                    Image URL
                </label>

                <input
                    type="text"
                    id="imageUrl"
                    placeholder="Enter project image URL"
                >

            </div>

        </div>


        <div class="button-group">

            <button onclick="addProject()">
                Add Project
            </button>

            <button
                class="edit-button"
                onclick="editProject()"
            >
                Edit Selected
            </button>

            <button
                class="delete-button"
                onclick="deleteProject()"
            >
                Delete Selected
            </button>

        </div>


        <div id="message" class="message"></div>

    </div>


    <div class="table-section">

        <h2>Projects</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Project Name</th>
                    <th>Location</th>
                    <th>Status</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                </tr>

            </thead>

            <tbody id="projectTableBody">

            </tbody>

        </table>

    </div>

</div>


<footer>

    <p>
        &copy; 2026 Zibele Construction. Management System.
    </p>

</footer>


<script>

    const API_URL = "http://localhost:3000";

    let selectedProjectId = null;


    async function loadProjects() {

        try {

            const response =
                await fetch(`${API_URL}/api/projects`);

            const projects =
                await response.json();

            const tableBody =
                document.getElementById("projectTableBody");

            tableBody.innerHTML = "";

            projects.forEach(project => {

                const row =
                    document.createElement("tr");

                row.innerHTML = `
                    <td>${project.project_id}</td>
                    <td>${project.project_name}</td>
                    <td>${project.location || ""}</td>
                    <td>${project.status || ""}</td>
                    <td>${project.start_date || ""}</td>
                    <td>${project.end_date || ""}</td>
                `;

                row.onclick = function() {

                    document
                        .querySelectorAll("tbody tr")
                        .forEach(r =>
                            r.classList.remove("selected-row")
                        );

                    row.classList.add("selected-row");

                    selectedProjectId =
                        project.project_id;

                    document.getElementById("projectName").value =
                        project.project_name || "";

                    document.getElementById("description").value =
                        project.description || "";

                    document.getElementById("location").value =
                        project.location || "";

                    document.getElementById("startDate").value =
                        project.start_date || "";

                    document.getElementById("endDate").value =
                        project.end_date || "";

                    document.getElementById("status").value =
                        project.status || "Planned";

                    document.getElementById("imageUrl").value =
                        project.image_url || "";

                };

                tableBody.appendChild(row);

            });

        } catch (error) {

            console.error(
                "Error loading projects:",
                error
            );

        }

    }


    async function addProject() {

        const project_name =
            document.getElementById("projectName").value;

        const description =
            document.getElementById("description").value;

        const location =
            document.getElementById("location").value;

        const start_date =
            document.getElementById("startDate").value;

        const end_date =
            document.getElementById("endDate").value;

        const status =
            document.getElementById("status").value;

        const image_url =
            document.getElementById("imageUrl").value;


        if (!project_name) {

            document.getElementById("message").textContent =
                "Please enter a project name.";

            return;

        }


        try {

            const response =
                await fetch(`${API_URL}/api/projects`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        project_name,
                        description,
                        location,
                        start_date,
                        end_date,
                        status,
                        image_url
                    })

                });


            if (response.ok) {

                document.getElementById("message").textContent =
                    "Project added successfully.";

                clearForm();

                loadProjects();

            } else {

                document.getElementById("message").textContent =
                    "Failed to add project.";

            }

        } catch (error) {

            console.error(error);

        }

    }


    async function editProject() {

        if (!selectedProjectId) {

            document.getElementById("message").textContent =
                "Please select a project first.";

            return;

        }


        const project_name =
            document.getElementById("projectName").value;

        const description =
            document.getElementById("description").value;

        const location =
            document.getElementById("location").value;

        const start_date =
            document.getElementById("startDate").value;

        const end_date =
            document.getElementById("endDate").value;

        const status =
            document.getElementById("status").value;

        const image_url =
            document.getElementById("imageUrl").value;


        try {

            const response =
                await fetch(
                    `${API_URL}/api/projects/${selectedProjectId}`,
                    {

                        method: "PUT",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            project_name,
                            description,
                            location,
                            start_date,
                            end_date,
                            status,
                            image_url
                        })

                    }
                );


            if (response.ok) {

                document.getElementById("message").textContent =
                    "Project updated successfully.";

                clearForm();

                selectedProjectId = null;

                loadProjects();

            }

        } catch (error) {

            console.error(error);

        }

    }


    async function deleteProject() {

        if (!selectedProjectId) {

            document.getElementById("message").textContent =
                "Please select a project first.";

            return;

        }


        try {

            const response =
                await fetch(
                    `${API_URL}/api/projects/${selectedProjectId}`,
                    {
                        method: "DELETE"
                    }
                );


            if (response.ok) {

                document.getElementById("message").textContent =
                    "Project deleted successfully.";

                clearForm();

                selectedProjectId = null;

                loadProjects();

            }

        } catch (error) {

            console.error(error);

        }

    }


    function clearForm() {

        document.getElementById("projectName").value = "";
        document.getElementById("description").value = "";
        document.getElementById("location").value = "";
        document.getElementById("startDate").value = "";
        document.getElementById("endDate").value = "";
        document.getElementById("status").value = "Planned";
        document.getElementById("imageUrl").value = "";

    }


    loadProjects();

</script>

</body>
</html>
