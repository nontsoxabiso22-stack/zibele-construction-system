<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - Zibele Construction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        header {
            background-color: #1f2937;
            color: white;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .back-button {
            background-color: white;
            color: #1f2937;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .form-section,
        .table-section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .full-width {
            grid-column: span 2;
        }

        .buttons {
            margin-top: 25px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            font-size: 15px;
        }

        .add-button {
            background-color: #2563eb;
            color: white;
        }

        .edit-button {
            background-color: #f59e0b;
            color: white;
        }

        .delete-button {
            background-color: #dc2626;
            color: white;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #1f2937;
            color: white;
        }

        tr:hover {
            background-color: #f3f4f6;
            cursor: pointer;
        }

        .selected-row {
            background-color: #dbeafe;
        }

        .status {
            font-weight: bold;
        }

        @media (max-width: 800px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }

            .table-section {
                overflow-x: auto;
            }

            table {
                min-width: 900px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Zibele Construction</h1>

    <a href="dashboard.html" class="back-button">
        Back to Dashboard
    </a>
</header>


<div class="container">

    <div class="form-section">

        <h2>Employee Information</h2>

        <div class="form-grid">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="full_name">
            </div>

            <div class="form-group">
                <label>Position</label>
                <input type="text" id="position">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" id="phone">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label>Department</label>
                <input type="text" id="department">
            </div>

            <div class="form-group">
                <label>Hire Date</label>
                <input type="date" id="hire_date">
            </div>

            <div class="form-group">
                <label>Status</label>

                <select id="status">
                    <option value="Active">Active</option>
                    <option value="Inactive">Inactive</option>
                    <option value="On Leave">On Leave</option>
                </select>

            </div>

        </div>


        <div class="buttons">

            <button class="add-button" onclick="addEmployee()">
                Add Employee
            </button>

            <button class="edit-button" onclick="editEmployee()">
                Edit Selected
            </button>

            <button class="delete-button" onclick="deleteEmployee()">
                Delete Selected
            </button>

        </div>

    </div>


    <div class="table-section">

        <h2>Employees</h2>

        <table>

            <thead>

                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Position</th>
                    <th>Phone</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Hire Date</th>
                    <th>Status</th>
                </tr>

            </thead>

            <tbody id="employeesTableBody">

            </tbody>

        </table>

    </div>

</div>


<script>

const API_URL = "http://localhost:3000";

let selectedEmployeeId = null;


// Load employees
async function loadEmployees() {

    try {

        const response = await fetch(
            `${API_URL}/api/employees`
        );

        const employees = await response.json();

        const tableBody =
            document.getElementById("employeesTableBody");

        tableBody.innerHTML = "";

        employees.forEach(employee => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${employee.employee_id}</td>
                <td>${employee.full_name}</td>
                <td>${employee.position}</td>
                <td>${employee.phone || ""}</td>
                <td>${employee.email || ""}</td>
                <td>${employee.department || ""}</td>
                <td>${employee.hire_date || ""}</td>
                <td class="status">${employee.status}</td>
            `;

            row.onclick = function() {

                document
                    .querySelectorAll("tbody tr")
                    .forEach(r => r.classList.remove("selected-row"));

                row.classList.add("selected-row");

                selectedEmployeeId =
                    employee.employee_id;

                fillForm(employee);
            };

            tableBody.appendChild(row);

        });

    } catch (error) {

        console.error("Error loading employees:", error);

    }

}


// Fill form when employee is selected
function fillForm(employee) {

    document.getElementById("full_name").value =
        employee.full_name || "";

    document.getElementById("position").value =
        employee.position || "";

    document.getElementById("phone").value =
        employee.phone || "";

    document.getElementById("email").value =
        employee.email || "";

    document.getElementById("department").value =
        employee.department || "";

    document.getElementById("hire_date").value =
        employee.hire_date || "";

    document.getElementById("status").value =
        employee.status || "Active";

}


// Add employee
async function addEmployee() {

    const employee = {

        full_name:
            document.getElementById("full_name").value,

        position:
            document.getElementById("position").value,

        phone:
            document.getElementById("phone").value,

        email:
            document.getElementById("email").value,

        department:
            document.getElementById("department").value,

        hire_date:
            document.getElementById("hire_date").value || null,

        status:
            document.getElementById("status").value

    };


    if (!employee.full_name || !employee.position) {

        alert("Please enter the employee name and position.");

        return;

    }


    try {

        const response = await fetch(
            `${API_URL}/api/employees`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(employee)
            }
        );


        if (!response.ok) {

            alert("Failed to add employee.");

            return;

        }


        alert("Employee added successfully!");

        clearForm();

        loadEmployees();

    } catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }

}


// Edit employee
async function editEmployee() {

    if (!selectedEmployeeId) {

        alert("Please select an employee first.");

        return;

    }


    const employee = {

        full_name:
            document.getElementById("full_name").value,

        position:
            document.getElementById("position").value,

        phone:
            document.getElementById("phone").value,

        email:
            document.getElementById("email").value,

        department:
            document.getElementById("department").value,

        hire_date:
            document.getElementById("hire_date").value || null,

        status:
            document.getElementById("status").value

    };


    try {

        const response = await fetch(
            `${API_URL}/api/employees/${selectedEmployeeId}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(employee)
            }
        );


        if (!response.ok) {

            alert("Failed to update employee.");

            return;

        }


        alert("Employee updated successfully!");

        clearForm();

        loadEmployees();

    } catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }

}


// Delete employee
async function deleteEmployee() {

    if (!selectedEmployeeId) {

        alert("Please select an employee first.");

        return;

    }


    const confirmDelete =
        confirm("Are you sure you want to delete this employee?");


    if (!confirmDelete) {

        return;

    }


    try {

        const response = await fetch(
            `${API_URL}/api/employees/${selectedEmployeeId}`,
            {
                method: "DELETE"
            }
        );


        if (!response.ok) {

            alert("Failed to delete employee.");

            return;

        }


        alert("Employee deleted successfully!");

        clearForm();

        loadEmployees();

    } catch (error) {

        console.error(error);

        alert("Unable to connect to the server.");

    }

}


// Clear form
function clearForm() {

    document.getElementById("full_name").value = "";
    document.getElementById("position").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("email").value = "";
    document.getElementById("department").value = "";
    document.getElementById("hire_date").value = "";
    document.getElementById("status").value = "Active";

    selectedEmployeeId = null;

}


// Load employees when page opens
loadEmployees();

</script>

</body>
</html>
